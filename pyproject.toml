[project]
name = "indic-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["datasets>=3.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["net: needs network access to Hugging Face"]
